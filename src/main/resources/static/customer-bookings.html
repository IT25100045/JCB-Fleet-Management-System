<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings - Customer Portal</title>
    <link rel="stylesheet" href="../../../../../../Downloads/JCB-Fleet-Management-System%20(2)/JCB-Fleet-Management-System/src/main/resources/static/style.css">
</head>
<body>
    
    <main class="container" style="margin-top: 80px;">
        <div class="welcome" style="margin-bottom: 2rem;">
            <div>
                <h2>My Bookings</h2>
                <p>Track the status of your current and past machinery rentals.</p>
            </div>
        </div>

        <div id="errorMsg" class="alert alert-danger" style="display: none;"></div>

        <div class="card" style="overflow-x: auto;">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Vehicle</th>
                        <th>Start Date</th>
                        <th>End Date</th>
                        <th>Status</th>
                        <th>Total Price</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="bookingsBody">
                    <tr><td colspan="7" style="text-align:center; color:var(--text-secondary);">Loading your bookings...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Feedback Modal -->
    <div id="feedbackModal" class="modal">
        <div class="modal-content">
            <h3>Leave Feedback</h3>
            <p style="color: var(--text-secondary); margin-bottom: 1rem;">Let us know how your experience was!</p>
            
            <div id="modalError" class="alert alert-danger" style="display: none; margin-bottom: 1rem;"></div>
            
            <form id="feedbackForm">
                <input type="hidden" id="feedbackBookingId">
                <div class="field">
                    <label>Rating (1-5)</label>
                    <input type="number" id="rating" min="1" max="5" required>
                </div>
                <div class="field">
                    <label>Comments</label>
                    <textarea id="comments" rows="3"></textarea>
                </div>
                <div class="modal-actions" style="margin-top: 1.5rem; display: flex; justify-content: flex-end; gap: 10px;">
                    <button type="button" class="btn-outline" onclick="closeFeedbackModal()">Cancel</button>
                    <button type="submit" class="btn-primary" id="submitFeedbackBtn">Submit</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../../../../../../Downloads/JCB-Fleet-Management-System%20(2)/JCB-Fleet-Management-System/src/main/resources/static/api.js"></script>
    <script src="../../../../../../Downloads/JCB-Fleet-Management-System%20(2)/JCB-Fleet-Management-System/src/main/resources/static/nav.js"></script>
    <script src="customer-bookings.js"></script>
</body>
</html>
