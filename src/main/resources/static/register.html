<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCB Fleet - Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="auth-wrapper">
        <div class="auth-image"></div>
        <div class="auth-container">
            <div class="auth-box">
                <div style="display:flex; justify-content:center; margin-bottom:15px;">
                    <div class="logo" style="width:70px; height:70px; font-size:38px;">🚜</div>
                </div>
                <h2>Create Account</h2>

                <div id="alertBox" style="display:none; padding:10px; border-radius:8px; margin-bottom:15px; font-size:13px;"></div>

                <form id="registerForm">
                    <div class="field">
                        <label>Full Name</label>
                        <input type="text" id="fullName" required>
                    </div>
                    <div class="field">
                        <label>Username</label>
                        <input type="text" id="username" required>
                    </div>
                    <div class="field">
                        <label>Email</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="field">
                        <label>Phone Number</label>
                        <input type="text" id="phone" required>
                    </div>
                    <div class="field">
                        <label>Password (Min 6 chars)</label>
                        <input type="password" id="password" required minlength="6">
                    </div>
                    <button type="submit" id="submitBtn" class="btn-primary" style="width:100%; padding:12px; margin-top:10px;">Register Account</button>
                </form>

                <a href="login.html" class="auth-link">Already have an account? Sign In</a>
            </div>
        </div>
    </div>

    <script src="api.js"></script>
    <script src="register.js"></script>
</body>
</html>
