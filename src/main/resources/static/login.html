<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCB Fleet - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="auth-wrapper">
        <div class="auth-image"></div>
        <div class="auth-container">
            <div class="auth-box">
                <div style="display:flex; justify-content:center; margin-bottom:15px;">
                    <div class="logo" style="width:70px; height:70px; font-size:38px;">🚜</div>
                </div>
                <h2>Sign In</h2>

                <div id="errorAlert" style="display:none; background:#fee2e2; color:#b91c1c; padding:10px; border-radius:8px; margin-bottom:15px; font-size:13px;"></div>

                <form id="loginForm">
                    <div class="field">
                        <label>Username</label>
                        <input type="text" id="username" required>
                    </div>
                    <div class="field">
                        <label>Password</label>
                        <input type="password" id="password" required>
                    </div>
                    <button type="submit" id="submitBtn" class="btn-primary" style="width:100%; padding:12px; margin-top:10px;">Sign In</button>
                </form>

                <a href="register.html" class="auth-link">Don't have an account? Register Here</a>
            </div>
        </div>
    </div>

    <script src="api.js"></script>
    <script src="login.js"></script>
</body>
</html>
